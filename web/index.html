<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Voice · Agronomist console</title>
<style>
  :root {
    --bg: #f4f1e8; --card: #fbf9f3; --ink: #1f2a1c; --muted: #5d6656; --line: #d6d0bd; --hover: #efe9d8;
    --accent: #2f5d3a; --accent-ink: #fff;
    --amber: #b8660b; --amber-bg: #fbe9cf; --green: #2c7a3f; --green-bg: #dcefd9;
    --blue: #2a5fb8; --blue-bg: #dde7f8; --grey: #7b7f78; --grey-bg: #e7e6e1;
    --new: #fff3b8; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a12; --card: #1b2318; --ink: #e9ecdf; --muted: #a3ab98; --line: #2e3829; --hover: #232d1f;
      --accent: #8fc79a; --accent-ink: #10180e;
      --amber: #f0b050; --amber-bg: #3d2c12; --green: #82cf93; --green-bg: #1d3420;
      --blue: #8db2f2; --blue-bg: #1b2a45; --grey: #9a9d96; --grey-bg: #2a2e28;
      --new: #4a4220; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between;
           padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 6px;
         cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.small { padding: 2px 9px; font-size: 12.5px; }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; }
  .seg .btn:first-child { border-radius: 6px 0 0 6px; }
  .seg .btn:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .live.paused::before { background: var(--amber); }
  .live.off::before { background: var(--danger); }
  .count { opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .scroll { overflow: auto; max-height: calc(100vh - 130px); }
  /* Laptop widths: corrections go under the table so all columns fit */
  @media (max-width: 1500px) {
    main { grid-template-columns: 1fr; }
    .scroll { max-height: none; }
    #corrections { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .corr { border-right: 1px solid var(--line); }
  }

  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; z-index: 1; background: var(--card); font-size: 11px; font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
  td { white-space: nowrap; }
  td.num { text-align: right; }
  td.wrap { white-space: normal; min-width: 170px; max-width: 260px; }
  td.mid { white-space: normal; min-width: 120px; max-width: 170px; }
  .sub { display: block; font-size: 12px; color: var(--muted); }
  .say { font-style: italic; color: var(--muted); }
  .tag { display: inline-block; font: 600 11px ui-monospace, monospace; padding: 1px 5px; border-radius: 3px;
         background: var(--grey-bg); color: var(--muted); text-transform: uppercase; }
  tr.new td { animation: flash 3s ease-out; }
  @keyframes flash { from { background: var(--new); } to { background: transparent; } }
  tr.discarded td { opacity: .55; }
  tr.needs_review td:first-child { box-shadow: inset 3px 0 var(--amber); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  .status { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
            background: var(--grey-bg); color: var(--grey); }
  .s-needs_review { background: var(--amber-bg); color: var(--amber); }
  .s-auto_approved, .s-validated { background: var(--green-bg); color: var(--green); }
  .s-corrected { background: var(--blue-bg); color: var(--blue); }
  .s-draft, .s-farmer_confirmed { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .score { font-weight: 700; }
  .score.low { color: var(--amber); }
  .actions { display: flex; gap: 4px; margin-top: 6px; }
  .fix .actions { margin-top: 0; }

  tr.form td { background: var(--hover); white-space: normal; }
  .fix { display: grid; grid-template-columns: 180px 220px minmax(220px, 1fr) auto; gap: 8px; align-items: end; }
  @media (max-width: 800px) { .fix { grid-template-columns: 1fr; } }
  .fix label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .fix input, .fix select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px;
                            background: var(--card); }
  .fix input:focus, .fix select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fix .err { grid-column: 1 / -1; color: var(--danger); font-size: 13px; }
  .fix .was { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }

  aside h2 { margin: 0; padding: 12px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); border-bottom: 1px solid var(--line); }
  .corr { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .corr:last-child { border-bottom: 0; }
  .corr .head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .corr .chg { margin: 4px 0; font: 13px ui-monospace, monospace; }
  .corr .chg s { color: var(--muted); }
  .corr p { margin: 0; }
  /* --- voice assistant (Task 6) --- */
  main { padding-bottom: 230px; }
  body::after { content: ""; position: fixed; inset: auto 0 0 0; height: 170px; z-index: 4; pointer-events: none;
                background: linear-gradient(to bottom, transparent, var(--bg) 62%); }  /* table fades out under the assistant */
  .assistant { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
               display: grid; justify-items: center; gap: 10px; width: min(680px, calc(100vw - 32px)); pointer-events: none; }
  .assistant > * { pointer-events: auto; }
  .orb { --lvl: 0; position: relative; width: 84px; height: 84px; border: 0; padding: 0; cursor: pointer;
         background: transparent; color: #fff; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  .orb .blob { position: absolute; inset: 0; border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%;
               background: radial-gradient(circle at 30% 28%, #9be3a8 0%, #3f9a55 38%, #1f6b4a 72%, #134d3f 100%);
               box-shadow: 0 8px 26px rgba(31, 107, 74, .35), inset 0 -6px 14px rgba(0, 0, 0, .18);
               transform: scale(calc(1 + var(--lvl) * .32)); transition: transform 90ms linear;
               animation: morph 7s ease-in-out infinite; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
               border: 2px solid #3f9a55; opacity: 0; pointer-events: none; }
  .orb svg { position: relative; width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .orb .i-think, .orb .i-speak { display: none; }
  .orb:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 50%; }
  .orb.listening .blob { animation-duration: 2.2s; background: radial-gradient(circle at 30% 28%, #b5f0c0 0%, #4cb86a 40%, #1f7a52 75%, #134d3f 100%); }
  .orb.listening::before { animation: ripple 1.8s ease-out infinite; }
  .orb.listening::after { animation: ripple 1.8s ease-out .9s infinite; }
  .orb.thinking .blob { animation: morph 1.6s ease-in-out infinite, swirl 1.4s linear infinite;
               background: conic-gradient(from 0deg, #1f6b4a, #6fd08a, #2a8fbf, #1f6b4a); }
  .orb.thinking .i-mic, .orb.speaking .i-mic { display: none; }
  .orb.thinking .i-think { display: block; }
  .orb.speaking .i-speak { display: block; }
  .orb.speaking .blob { animation-duration: 3s; background: radial-gradient(circle at 30% 28%, #a8d8f5 0%, #3f8fc4 40%, #1f5a8a 75%, #143c5e 100%);
               box-shadow: 0 8px 30px rgba(42, 95, 184, .4); }
  .orb.speaking::before { border-color: #3f8fc4; animation: ripple 2.4s ease-out infinite; }
  @keyframes morph {
    0%, 100% { border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%; }
    25% { border-radius: 58% 42% 46% 54% / 44% 58% 42% 56%; }
    50% { border-radius: 42% 58% 60% 40% / 56% 42% 58% 44%; }
    75% { border-radius: 54% 46% 40% 60% / 48% 60% 40% 52%; } }
  @keyframes ripple { from { transform: scale(1); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }
  @keyframes swirl { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) {
    .orb .blob, .orb::before, .orb::after { animation: none !important; } }
  .subs { min-height: 0; max-width: 100%; text-align: center; padding: 8px 16px; border-radius: 10px;
          background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(6px);
          border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .subs:empty { display: none; }
  .subs .q { font-size: 13px; color: var(--muted); }
  .subs .a { font-size: 17px; line-height: 1.4; margin-top: 2px; }
  .subs .a .w { opacity: .18; transition: opacity .15s; }
  .subs .a .w.on { opacity: 1; }
  .subs .hint { font-size: 13px; color: var(--muted); }
  .subs .err { color: var(--danger); font-size: 14px; }
  .voices { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .voices select { max-width: 230px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                   background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  @media (max-width: 760px) { .voices { position: static; padding: 0 20px 12px; } main { padding-bottom: 260px; } }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px;
           background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Field Voice <small id="subtitle"></small></h1>
  <div class="bar">
    <span class="live" id="live"></span>
    <button class="btn" id="review" aria-pressed="false"></button>
    <span class="seg" role="group" aria-label="Language">
      <button class="btn" data-lang="ca">CA</button><button class="btn" data-lang="en">EN</button>
    </span>
    <a class="btn primary" id="report" href="api/report.xlsx" download></a>
  </div>
</header>

<main>
  <section class="panel">
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>
  <aside class="panel">
    <h2 id="corr-title"></h2>
    <div class="scroll" id="corrections"></div>
  </aside>
</main>
<div class="assistant">
  <button class="orb" id="orb" type="button" aria-label="">
    <span class="blob"></span>
    <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg class="i-think" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>
    <svg class="i-speak" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
  </button>
  <div class="subs" id="subs" aria-live="polite"></div>
</div>
<label class="voices"><span id="voice-label"></span><select id="voice"></select></label>
<div id="toast" role="status"></div>

<script>
// Agronomist console (Person 2, Task 4). Talks only to /api/* on this server; the browser reuses the login.
const T = {
  ca: {
    subtitle: "Consola de l'agrònom", live: "en directe", paused: "en pausa (corregint)", offline: "sense connexió",
    review: "Només pendents", report: "Descarrega l'informe", empty: "Encara no hi ha registres. Envia una nota de veu al bot.",
    emptyReview: "Res pendent de revisió.", corrTitle: "El que aprèn el model", noCorr: "Encara no hi ha correccions.",
    cols: ["Data", "Pagès", "Parcel·la", "Cultiu", "Activitat", "Producte", "Quantitat", "Dosi/ha",
           "Estat", "Jutge", "Transcripció original"],
    approve: "Aprova", correct: "Corregeix", field: "Camp", value: "Valor nou", reason: "Motiu (obligatori)",
    save: "Desa", cancel: "Cancel·la", was: "Valor actual", reasonNeeded: "Cal un motiu: és el que aprèn el model.",
    approved: "aprovat", corrected: "corregit", by: "per",
    voice: "Veu", ownVoices: "Les teves veus", talk: "Parla amb l'assistent", hint: "Prem i pregunta: «Quant coure he fet servir als ametllers?»",
    listening: "T'escolto…", thinking: "Consultant el registre…", noSpeech: "No t'he sentit. Torna a prémer per parlar.",
    micDenied: "Cal permís per al micròfon.",
    status: { draft: "esborrany", farmer_confirmed: "confirmat pel pagès", auto_approved: "aprovat automàticament",
              needs_review: "pendent de revisió", validated: "validat", corrected: "corregit", discarded: "descartat" },
    fields: { date: "Data", parcel_alias: "Parcel·la", activity_key: "Activitat", product: "Producte",
              target_pest_key: "Plaga / objectiu", quantity: "Quantitat", unit: "Unitat", area_ha: "Superfície (ha)",
              notes_ca: "Notes (CA)", notes_en: "Notes (EN)" },
  },
  en: {
    subtitle: "Agronomist console", live: "live", paused: "paused (correcting)", offline: "offline",
    review: "Needs review only", report: "Download report", empty: "No records yet. Send a voice note to the bot.",
    emptyReview: "Nothing needs review.", corrTitle: "What the model learns from", noCorr: "No corrections yet.",
    cols: ["Date", "Farmer", "Parcel", "Crop", "Activity", "Product", "Quantity", "Dose/ha",
           "Status", "Judge", "Original transcript"],
    approve: "Approve", correct: "Correct", field: "Field", value: "New value", reason: "Reason (required)",
    save: "Save", cancel: "Cancel", was: "Current value", reasonNeeded: "A reason is required: it is what the model learns from.",
    approved: "approved", corrected: "corrected", by: "by",
    voice: "Voice", ownVoices: "Your voices", talk: "Talk to the assistant", hint: "Tap and ask: “How much copper did I use on the almonds?”",
    listening: "Listening…", thinking: "Checking the log…", noSpeech: "I didn't hear anything. Tap again to talk.",
    micDenied: "Microphone permission is needed.",
    status: { draft: "draft", farmer_confirmed: "farmer confirmed", auto_approved: "auto-approved",
              needs_review: "needs review", validated: "validated", corrected: "corrected", discarded: "discarded" },
    fields: { date: "Date", parcel_alias: "Parcel", activity_key: "Activity", product: "Product",
              target_pest_key: "Pest / target", quantity: "Quantity", unit: "Unit", area_ha: "Area (ha)",
              notes_ca: "Notes (CA)", notes_en: "Notes (EN)" },
  },
};
// Must match app/web.py WEB_EDITABLE and the status moves in app/schemas.py STATUS_TRANSITIONS
const EDITABLE = ["date", "parcel_alias", "activity_key", "product", "target_pest_key",
                  "quantity", "unit", "area_ha", "notes_ca", "notes_en"];
const CAN_APPROVE = new Set(["needs_review", "auto_approved", "corrected"]);
const CAN_CORRECT = new Set(["needs_review", "auto_approved", "validated", "corrected"]);
const POLL_MS = 2000;

const state = { lang: "ca", reviewOnly: false, records: [], corrections: [], parcels: [], vocab: [],
                seen: null, openForm: null };
try { state.lang = localStorage.getItem("fv-lang") || "ca"; } catch {}
const t = () => T[state.lang];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => n == null ? "" : (Math.round(n * 100) / 100).toLocaleString(state.lang === "ca" ? "ca" : "en");
const label = (r, base) => r[`${base}_${state.lang}`] ?? r[`${base}_en`] ?? "";

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("on"), 2500);
}

async function api(path, opts = {}) {
  const res = await fetch(`api/${path}`, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || res.statusText));
  }
  return body;
}

// --- rendering -------------------------------------------------------------------

function renderChrome() {
  document.documentElement.lang = state.lang;
  $("subtitle").textContent = t().subtitle;
  $("corr-title").textContent = t().corrTitle;
  $("report").textContent = `⬇ ${t().report}`;
  $("voice-label").textContent = t().voice;
  $("orb").setAttribute("aria-label", t().talk);
  renderVoices();
  if (asst.mode === "idle" && !asst.answer) setSubs(`<div class="hint">${esc(t().hint)}</div>`);
  $("head").innerHTML = t().cols.map(c => `<th>${esc(c)}</th>`).join("");
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === state.lang);
  $("review").setAttribute("aria-pressed", state.reviewOnly);
  renderLive();
}

function renderLive(offline = false) {
  const el = $("live");
  el.className = "live" + (offline ? " off" : state.openForm ? " paused" : "");
  el.textContent = offline ? t().offline : state.openForm ? t().paused : t().live;
  const n = state.records.filter(r => r.status === "needs_review").length;
  $("review").innerHTML = `${esc(t().review)}<span class="count">${n}</span>`;
}

function row(r) {
  const cls = [r.status, state.seen && !state.seen.has(r.id) ? "new" : ""].join(" ");
  const score = r.judge_score == null ? "" :
    `<span class="score ${r.judge_score < 0.8 ? "low" : ""}">${r.judge_score.toFixed(2)}</span>`;
  const qty = r.quantity == null ? "" : `${num(r.quantity)} ${esc(r.unit || "")}`;
  const dose = r.dose_per_ha == null ? "" : `${num(r.dose_per_ha)} ${esc(r.unit || "")}/ha`;
  const pest = r.target_pest_key ? `<span class="sub">${esc(label(r, "target_pest"))}</span>` : "";
  const acts = [
    CAN_APPROVE.has(r.status) ? `<button class="btn small" data-act="approve">${esc(t().approve)}</button>` : "",
    CAN_CORRECT.has(r.status) ? `<button class="btn small" data-act="correct">${esc(t().correct)}</button>` : "",
  ].join("");
  return `<tr class="${cls}" data-id="${r.id}">
    <td>${esc(r.date || "")}<span class="sub">${esc(r.record_id)}</span></td>
    <td>${esc(r.farmer_name || r.farmer_chat_id)}<span class="sub"><span class="tag">${esc(r.lang)}</span></span></td>
    <td>${esc(r.parcel_alias || "—")}<span class="sub">${esc(r.sigpac_ref || "")}</span></td>
    <td>${esc(r.crop_key ? label(r, "crop") : "")}${r.crop_spoken ? `<span class="sub say">“${esc(r.crop_spoken)}”</span>` : ""}</td>
    <td class="mid">${esc(label(r, "activity"))}${pest}</td>
    <td class="mid">${esc(r.product || "")}</td>
    <td class="num">${qty}</td>
    <td class="num">${dose}</td>
    <td><span class="status s-${esc(r.status)}">${esc(t().status[r.status] || r.status)}</span>
      ${acts ? `<div class="actions">${acts}</div>` : ""}</td>
    <td class="wrap">${score}${r.judge_reason ? `<span class="sub">${esc(r.judge_reason)}</span>` : ""}</td>
    <td class="wrap say">${r.transcript_original ? `“${esc(r.transcript_original)}”` : ""}</td>
  </tr>` + (state.openForm?.id === r.id ? formRow(r) : "");
}

function renderRows() {
  const rows = state.records.filter(r => !state.reviewOnly || r.status === "needs_review");
  $("rows").innerHTML = rows.map(row).join("");
  $("empty").hidden = rows.length > 0;
  $("empty").textContent = state.reviewOnly ? t().emptyReview : t().empty;
  if (state.openForm) restoreForm();
  state.seen = new Set(state.records.map(r => r.id));
}

function renderCorrections() {
  const list = state.corrections.slice(0, 10);
  $("corrections").innerHTML = list.length ? list.map(c => `
    <div class="corr">
      <div class="head"><span>R${String(c.record_id).padStart(4, "0")} · ${esc(t().fields[c.field] || c.field)}</span>
        <span>${esc(c.corrected_by)} · ${esc((c.timestamp || "").slice(0, 16).replace("T", " "))}</span></div>
      <div class="chg"><s>${esc(c.before ?? "∅")}</s> → <b>${esc(c.after ?? "∅")}</b></div>
      <p>${esc(c.reason)}</p>
    </div>`).join("") : `<div class="corr empty">${esc(t().noCorr)}</div>`;
}

function render() { renderChrome(); renderRows(); renderCorrections(); }

// --- correction form ---------------------------------------------------------------

function valueInput(field, current) {
  const opt = (v, l) => `<option value="${esc(v)}" ${String(v) === String(current ?? "") ? "selected" : ""}>${esc(l)}</option>`;
  const vocab = type => state.vocab.filter(v => v.type === type)
    .map(v => opt(v.key, `${v[state.lang] || v.en || v.key} (${v.key})`)).join("");
  switch (field) {
    case "date": return `<input name="value" type="date" value="${esc(current)}">`;
    case "quantity": case "area_ha": return `<input name="value" type="number" step="any" min="0" value="${esc(current)}">`;
    case "parcel_alias": return `<select name="value">${state.parcels.map(p => {
      const crop = state.vocab.find(v => v.type === "crop" && v.key === p.crop_key);
      return opt(p.alias, `${p.alias} · ${crop?.[state.lang] || p.crop_key} · ${p.area_ha} ha`);
    }).join("")}</select>`;
    case "activity_key": return `<select name="value">${vocab("activity")}</select>`;
    case "target_pest_key": return `<select name="value">${opt("", "—")}${vocab("pest")}${opt("unknown", "unknown")}</select>`;
    default: return `<input name="value" type="text" value="${esc(current)}">`;
  }
}

function formRow(r) {
  const f = state.openForm;
  return `<tr class="form" data-form="${r.id}"><td colspan="11"><form class="fix">
    <label>${esc(t().field)}<select name="field">${EDITABLE.map(k =>
      `<option value="${k}" ${k === f.field ? "selected" : ""}>${esc(t().fields[k])}</option>`).join("")}</select></label>
    <label>${esc(t().value)}<span data-slot="value">${valueInput(f.field, f.value)}</span></label>
    <label>${esc(t().reason)}<input name="reason" type="text" value="${esc(f.reason)}" autocomplete="off"></label>
    <div class="actions"><button class="btn primary" type="submit">${esc(t().save)}</button>
      <button class="btn" type="button" data-act="cancel">${esc(t().cancel)}</button></div>
    <div class="was">${esc(t().was)}: <b>${esc(r[f.field] ?? "∅")}</b></div>
    ${f.error ? `<div class="err">${esc(f.error)}</div>` : ""}
  </form></td></tr>`;
}

function restoreForm() {
  const form = document.querySelector("tr.form form");
  if (!form) return;
  const focus = state.openForm.focus;
  if (focus) form.elements[focus]?.focus();
}

function openForm(id) {
  const r = state.records.find(x => x.id === id);
  state.openForm = { id, field: "quantity", value: r.quantity ?? "", reason: "", error: "", focus: "value" };
  renderRows(); renderLive();
}

function closeForm() { state.openForm = null; renderRows(); renderLive(); }

$("rows").addEventListener("input", e => {
  const f = state.openForm; if (!f || !e.target.form) return;
  if (e.target.name === "reason") f.reason = e.target.value;
  if (e.target.name === "value") f.value = e.target.value;
});

$("rows").addEventListener("change", e => {
  const f = state.openForm; if (!f || e.target.name !== "field") return;
  const r = state.records.find(x => x.id === f.id);
  f.field = e.target.value; f.value = r[f.field] ?? ""; f.error = ""; f.focus = "value";
  e.target.form.querySelector("[data-slot=value]").innerHTML = valueInput(f.field, f.value);
  e.target.form.querySelector(".was b").textContent = r[f.field] ?? "∅";
});

$("rows").addEventListener("submit", async e => {
  e.preventDefault();
  const f = state.openForm;
  f.value = e.target.elements.value.value;
  f.reason = e.target.elements.reason.value.trim();
  if (!f.reason) { f.error = t().reasonNeeded; f.focus = "reason"; return renderRows(); }
  try {
    await api(`records/${f.id}`, { method: "PATCH",
      body: JSON.stringify({ field: f.field, value: f.value === "" ? null : f.value, reason: f.reason, by: "agronomist" }) });
    toast(`R${String(f.id).padStart(4, "0")} ${t().corrected}`);
    state.openForm = null;
    await refresh();
  } catch (err) { f.error = err.message; f.focus = "value"; renderRows(); }
});

$("rows").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const id = +btn.closest("tr").dataset.id || +btn.closest("tr.form")?.dataset.form;
  if (btn.dataset.act === "cancel") return closeForm();
  if (btn.dataset.act === "correct") return state.openForm?.id === id ? closeForm() : openForm(id);
  if (btn.dataset.act === "approve") {
    btn.disabled = true;
    try { await api(`records/${id}/approve`, { method: "POST" }); toast(`R${String(id).padStart(4, "0")} ${t().approved}`); }
    catch (err) { toast(err.message); }
    await refresh();
  }
});

// --- voice assistant (Task 6) -------------------------------------------------------
// One tap starts a conversation: listen -> (pause ends the question) -> server: Scribe -> LLM -> TTS -> play,
// then listen again for a follow-up. Tap again or stay silent to end it.

const asst = { mode: "idle", stream: null, ctx: null, rec: null, raf: 0, audio: null, history: [],
               answer: "", voices: [], defaultVoice: "", voice: "" };
const SILENCE_MS = 1300, NO_SPEECH_MS = 7000, MAX_MS = 20000, HISTORY = 6;
try { asst.voice = localStorage.getItem("fv-voice") || ""; } catch {}

function setSubs(html) { $("subs").innerHTML = html; }
function setMode(mode) {
  asst.mode = mode;
  $("orb").className = `orb ${mode}`;
  if (mode !== "listening" && mode !== "speaking") $("orb").style.setProperty("--lvl", 0);
}

function renderVoices() {
  const sel = $("voice");
  if (!asst.voices.length) { sel.innerHTML = ""; sel.disabled = true; return; }
  const opt = v => `<option value="${esc(v.voice_id)}" ${v.voice_id === (asst.voice || asst.defaultVoice) ? "selected" : ""}>${
    esc(v.name)}${v.description ? ` · ${esc(v.description)}` : ""}</option>`;
  const own = asst.voices.filter(v => v.category !== "premade"), lib = asst.voices.filter(v => v.category === "premade");
  sel.innerHTML = (own.length ? `<optgroup label="${esc(t().ownVoices)}">${own.map(opt).join("")}</optgroup>` : "")
    + `<optgroup label="ElevenLabs">${lib.map(opt).join("")}</optgroup>`;
  sel.disabled = false;
}

$("voice").addEventListener("change", e => {
  asst.voice = e.target.value;
  try { localStorage.setItem("fv-voice", asst.voice); } catch {}
});

function level(analyser, buf) {           // RMS of the current audio frame, 0..~0.5
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (const x of buf) s += x * x;
  return Math.sqrt(s / buf.length);
}

async function ensureMic() {
  asst.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
  await asst.ctx.resume();
  if (!asst.stream || asst.stream.getTracks().some(tr => tr.readyState === "ended")) {
    asst.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  }
}

function endConversation(message = "") {
  cancelAnimationFrame(asst.raf);
  if (asst.rec?.state === "recording") { asst.rec.onstop = null; asst.rec.stop(); }
  if (asst.audio) { asst.audio.pause(); asst.audio = null; }
  asst.stream?.getTracks().forEach(tr => tr.stop());   // releases the browser's mic indicator
  asst.stream = null;
  setMode("idle");
  if (message) setSubs(message);
}

function listen() {
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(m => window.MediaRecorder?.isTypeSupported(m)) || "";
  const rec = new MediaRecorder(asst.stream, mime ? { mimeType: mime } : {});
  const chunks = [];
  asst.rec = rec;
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => ask(new Blob(chunks, { type: rec.mimeType }), rec.mimeType.includes("mp4") ? "mp4" : "webm");

  const src = asst.ctx.createMediaStreamSource(asst.stream), an = asst.ctx.createAnalyser();
  an.fftSize = 1024; src.connect(an);
  const buf = new Float32Array(an.fftSize), started = performance.now();
  let floor = 0, frames = 0, heard = false, lastVoice = started;
  setMode("listening");
  if (!asst.history.length) setSubs(`<div class="hint">${esc(t().listening)}</div>`);  // follow-ups keep the last answer
  rec.start(250);

  const tick = now => {
    const lvl = level(an, buf);
    if (frames < 15) { floor = Math.max(floor, lvl); frames++; }        // ~250 ms of room noise
    const threshold = Math.max(0.015, floor * 2.5);
    $("orb").style.setProperty("--lvl", Math.min(1, lvl * 6).toFixed(3));
    if (lvl > threshold) { heard = true; lastVoice = now; }
    const elapsed = now - started;
    if (heard && (now - lastVoice > SILENCE_MS || elapsed > MAX_MS)) { src.disconnect(); return rec.stop(); }
    if (!heard && elapsed > NO_SPEECH_MS) {             // silence: end; after an answer, end quietly
      src.disconnect();
      return endConversation(asst.history.length ? "" : `<div class="hint">${esc(t().noSpeech)}</div>`);
    }
    asst.raf = requestAnimationFrame(tick);
  };
  asst.raf = requestAnimationFrame(tick);
}

async function ask(blob, ext) {
  cancelAnimationFrame(asst.raf);
  setMode("thinking");
  setSubs(`<div class="hint">${esc(t().thinking)}</div>`);
  const form = new FormData();
  form.append("audio", blob, `question.${ext}`);
  form.append("lang", state.lang);
  form.append("voice_id", asst.voice || asst.defaultVoice);
  form.append("history", JSON.stringify(asst.history.slice(-HISTORY)));
  let res;
  try {
    const r = await fetch("api/ask", { method: "POST", body: form });
    res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.detail || r.statusText);
  } catch (err) {
    return endConversation(`<div class="err">${esc(err.message)}</div>`);
  }
  if (asst.mode !== "thinking") return;                 // ended while waiting
  asst.history.push({ role: "user", text: res.question }, { role: "assistant", text: res.answer });
  speak(res);
}

function speak(res) {
  asst.answer = res.answer;
  const words = res.answer.split(/\s+/);
  setSubs(`<div class="q">${esc(res.question)}</div><div class="a" lang="${esc(res.lang)}">${
    words.map(w => `<span class="w">${esc(w)}</span>`).join(" ")}</div>`);
  const spans = [...$("subs").querySelectorAll(".a .w")];
  const showAll = () => spans.forEach(s => s.classList.add("on"));
  if (!res.audio) { showAll(); setMode("idle"); return setTimeout(() => asst.mode === "idle" && asst.stream && listen(), 1500); }

  const audio = new Audio(`data:audio/mpeg;base64,${res.audio}`);
  asst.audio = audio;
  const src = asst.ctx.createMediaElementSource(audio), an = asst.ctx.createAnalyser();
  an.fftSize = 1024; src.connect(an); an.connect(asst.ctx.destination);
  const buf = new Float32Array(an.fftSize);
  setMode("speaking");
  const tick = () => {
    $("orb").style.setProperty("--lvl", Math.min(1, level(an, buf) * 5).toFixed(3));
    if (audio.duration) {                                 // reveal words in step with the voice
      const n = Math.ceil(words.length * Math.min(1, audio.currentTime / (audio.duration * 0.92)));
      spans.forEach((s, i) => s.classList.toggle("on", i < n));
    }
    asst.raf = requestAnimationFrame(tick);
  };
  audio.onended = () => {
    cancelAnimationFrame(asst.raf); showAll(); asst.audio = null;
    if (asst.mode === "speaking") listen();                // keep the conversation going
  };
  audio.play().then(() => { asst.raf = requestAnimationFrame(tick); })
    .catch(() => { showAll(); setMode("idle"); });
}

$("orb").addEventListener("click", async () => {
  if (asst.mode === "listening") { cancelAnimationFrame(asst.raf); return asst.rec.stop(); }   // done talking
  if (asst.mode === "speaking" || asst.mode === "thinking") return endConversation(asst.answer ? $("subs").innerHTML : "");
  try { await ensureMic(); }
  catch { return setSubs(`<div class="err">${esc(t().micDenied)}</div>`); }
  asst.history = [];
  listen();
});

async function loadVoices() {
  try {
    const r = await api("voices");
    asst.voices = r.voices; asst.defaultVoice = r.default;
    if (asst.voice && !asst.voices.some(v => v.voice_id === asst.voice)) asst.voice = "";
  } catch { asst.voices = []; }
  renderVoices();
}

// --- controls + polling -----------------------------------------------------------

$("review").addEventListener("click", () => { state.reviewOnly = !state.reviewOnly; render(); });
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => {
  state.lang = b.dataset.lang;
  try { localStorage.setItem("fv-lang", state.lang); } catch {}
  render();
});

async function refresh() {
  try {
    const [records, corrections] = await Promise.all([api("records"), api("corrections")]);
    state.records = records; state.corrections = corrections;
    if (!state.openForm) renderRows();   // never rebuild the table under the agronomist's typing
    renderCorrections(); renderLive();
  } catch { renderLive(true); }
}

(async () => {
  renderChrome();
  loadVoices();
  try { [state.parcels, state.vocab] = await Promise.all([api("parcels"), api("vocabulary")]); } catch {}
  await refresh();
  setInterval(refresh, POLL_MS);
})();
</script>
</body>
</html>
