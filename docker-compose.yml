# docker compose up --build   -> seed, then web on http://localhost:8000 and the Telegram bot
name: fieldvoice

x-app: &app
  build: .
  image: fieldvoice:dev
  env_file: .env
  environment:
    DB_PATH: data/fieldvoice.db
  volumes:
    # Database, audio, TTS cache, logs and exports, shared by all services
    - fieldvoice-data:/app/data
    # Reference workbook from the repo, so edits reach the next seed without a rebuild
    - ./data/satech_dun_field_log_sample.xlsx:/app/data/satech_dun_field_log_sample.xlsx:ro

services:
  seed:
    <<: *app
    command: ["python", "-m", "app.seed"]
    restart: "no"

  web:
    <<: *app
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  fieldvoice-data:
